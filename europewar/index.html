/* ---- LOAD MAP ---- */
const COLOR_TOL=90;  // how far (RGB distance) a pixel may be from a nation color and still count (JPEG blur)
function loadMap(file,pre){return new Promise((res,rej)=>{
 const im=new Image();im.onerror=()=>rej('Could not load '+file+'. Put it next to this HTML file.');
 im.onload=()=>{
  W=im.naturalWidth;H=im.naturalHeight;N=W*H;
  const t=document.createElement('canvas');t.width=W;t.height=H;const c=t.getContext('2d',{willReadFrequently:true});c.drawImage(im,0,0);
  let d;try{d=c.getImageData(0,0,W,H).data}catch(e){return rej('Browser blocked pixel reading (file:// restriction). Run a local server in this folder: "python -m http.server" and open http://localhost:8000/game.html')}
  land=new Uint8Array(N);owner=new Uint16Array(N);ftm=new Float64Array(N);totalLand=0;
  const map=new Uint8Array(N),pc=pre.map(p=>[1,3,5].map(k=>parseInt(p.color.substr(k,2),16)));
  for(let i=0;i<N;i++){const k=i*4,r=d[k],g=d[k+1],b=d[k+2];let m=0;
   if(pc.length&&Math.max(r,g,b)-Math.min(r,g,b)>=40){let bd=COLOR_TOL*COLOR_TOL;for(let q=0;q<pc.length;q++){const e=(r-pc[q][0])**2+(g-pc[q][1])**2+(b-pc[q][2])**2;if(e<bd){bd=e;m=q+1}}}
   if(m){land[i]=1;map[i]=m;totalLand++}else if((r+g+b)/3>=LAND_T){land[i]=1;totalLand++}}
  comp=new Uint32Array(N);bq=new Int32Array(N);par=new Int32Array(N);vis=new Uint32Array(N);
  let cid=0;
  for(let i=0;i<N;i++)if(!land[i]&&!comp[i]){cid++;let sp=0;bq[sp++]=i;comp[i]=cid;
   while(sp){const c=bq[--sp],x=c%W;
    if(x>0&&!land[c-1]&&!comp[c-1]){comp[c-1]=cid;bq[sp++]=c-1}
    if(x<W-1&&!land[c+1]&&!comp[c+1]){comp[c+1]=cid;bq[sp++]=c+1}
    if(c>=W&&!land[c-W]&&!comp[c-W]){comp[c-W]=cid;bq[sp++]=c-W}
    if(c<N-W&&!land[c+W]&&!comp[c+W]){comp[c+W]=cid;bq[sp++]=c+W}}}
  imgData=new ImageData(W,H);px32=new Uint32Array(imgData.data.buffer);
  off=document.createElement('canvas');off.width=W;off.height=H;octx=off.getContext('2d');
  resize();res(map)};
 im.src=file})}

function hsl(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]}
function recalc(n){const M={};for(const k in KN){let v=1+(n.fm[k]||0);for(const t of TECH)if(t.k===k)v+=t.p*(n.tl[t.id]||0);for(const id of n.ideo)v+=IDEO.find(x=>x.id===id).m[k]||0;if(k==='res')v+=.25*n.b.univ;M[k]=Math.max(.2,v)}n.M=M}
function mk(o){

function paint(i){
 const o=owner[i];
 if(!o){px32[i]=land[i]?LANDC:OCEAN;return}

 const x=i%W;
 if((x>0&&owner[i-1]&&owner[i-1]!==o)||(x<W-1&&owner[i+1]&&owner[i+1]!==o)||(i>=W&&owner[i-W]&&owner[i-W]!==o)||(i<N-W&&owner[i+W]&&owner[i+W]!==o)){
  const l=.3*r+.59*g+.11*b,t2=l>110?0:255;r+=(t2-r)*.65;g+=(t2-g)*.65;b+=(t2-b)*.65}
 px32[i]=(255<<24)|((b|0)<<16)|((g|0)<<8)|(r|0)}

function setOwner(i,id,anim){

function build(n,ty,i){
 if(owner[i]!==n.id)return'You can only build on your own territory';
 if(n.gold<bcost(n,ty))return'Not enough gold';
 const x=i%W,y=(i/W)|0;
 for(const b of blds)if((b.x-x)**2+(b.y-y)**2<MIND*MIND)return'Too close to another building';

 const ratio=$('rt').value/100,tr=n.troops*ratio;if(tr<30)return msg('Not enough troops',false);
 if(!ship){const s=seedFront(n,tid,sel);if(s.length){launch(n,tid,tr,sel,s);hud();return}}
 if(sendShip(n,sel,ratio,true))hud()}
function conscript(){const n=player;if(phase!=='play'||n.gold<150)return;n.gold-=150;n.troops=Math.min(maxT(n),n.troops+400);hud()}
function speedT(){speed=speed===1?2:speed===2?4:1;$('sp').textContent=speed+'x'}
function togg(id){if(phase!=='play')return;const e=$(id),open=e.classList.contains('hide');
 for(const k of['bld','tech'])$(k).classList.add('hide');
 if(open){(id==='bld'?bldUI:techUI)();e.classList.remove('hide');snd('menu')}}
function bldUI(){$('bld').innerHTML='<h3>Construct</h3><div class="sub" style="margin-bottom:6px">Then click your territory. Buildings need '+MIND+'+ tiles of spacing, so more land = more buildings.</div>'+
 Object.keys(BT).map(k=>`<div class="row r"><span><img class="ic" src="${IURL(k)}"> ${BT[k].n} <span class="sub">${BT[k].d} (own ${player.b[k]})</span></span><button onclick="setB('${k}')">${bcost(player,k)}g</button></div>`).join('')}
function setB(k){bmode=k;$('bld').classList.add('hide');cv.style.cursor='crosshair';msg('Click your territory to place a '+BT[k].n+' (Esc to cancel)',false)}
let tab='tech';
function setTab(k){tab=k;techUI()}
const modHTML=m=>Object.entries(m).map(([k,v])=>`<div style="font-size:13px;color:${v>0?'#8d8':'#e88'}">${v>0?'+':''}${Math.round(v*100)}% ${KN[k]}</div>`).join('');
const progCard=(label,left,total,sub)=>`<div class="card" style="margin-bottom:8px"><div class="row r"><b>${label}</b><span class="sub">${sub}</span></div><div class="pb"><i style="width:${(1-left/total)*100}%"></i></div></div>`;
function techUI(){
 const n=player;if(tab==='focus'&&!n.focuses.length)tab='tech';
 const tb=(k,l)=>`<button style="${tab===k?'background:#2c2c2c':''}" onclick="setTab('${k}')">${l}</button>`;
 let h=`<div style="display:flex;gap:6px;margin-bottom:10px">${tb('tech','Technologies')}${tb('ideo','Ideology')}${n.focuses.length?tb('focus','National Focus'):''}</div>`;
 if(tab==='tech'){
  h+=n.res?progCard(n.res.name,n.res.left,n.res.total,Math.ceil(n.res.left/n.M.res)+'s left'):'<div class="card sub" style="margin-bottom:8px">No active research. One technology at a time.</div>';
  h+='<div class="grid">'+TECH.map(t=>{const l=n.tl[t.id]||0,c=300*(l+1);
   return`<div class="card"><div class="row r"><b>${t.n}</b><span>${'●'.repeat(l)}${'○'.repeat(3-l)}</span></div><div class="sub" style="margin:4px 0 8px">${KN[t.k]} +${Math.round(t.p*100)}% per level</div>${l<3?`<button class="${n.res||n.gold<c?'dis':''}" onclick="research('${t.id}')">Research · ${c}g · ${25*(l+1)}s</button>`:'<div class="sub">Maxed</div>'}</div>`}).join('')+'</div>'}
 else if(tab==='ideo'){
  h+=`<div class="sub" style="margin-bottom:8px">Current: <b style="color:#fff">${ideoName(n)}</b>. Changing is instant and costs gold only. Higher tiers need the previous step of the same path.</div><div class="grid3">`;
  for(let p=0;p<3;p++){h+='<div>';for(const x of IDEO.filter(q=>q.p===p)){
   const act=n.ideo[n.ideo.length-1]===x.id,inp=n.ideo.includes(x.id)&&!act,can=canAdopt(n,x),c=400*x.t;
   h+=`<div class="card" style="margin-bottom:8px;opacity:${can||act||inp?1:.4};${act?'background:#17261c':''}"><div class="sub">Tier ${x.t}</div><b>${x.n}</b><div style="margin:4px 0 8px">${modHTML(x.m)}</div>${act?'<div class="sub">Active</div>':inp?'<div class="sub">In path</div>':can?`<button class="${n.gold<c?'dis':''}" onclick="adoptUI('${x.id}')">Adopt · ${c}g</button>`:'<div class="sub">Locked</div>'}</div>`}
   h+='</div>'}
  h+='</div>'}
 else{
  h+=n.focus?progCard(n.focuses[n.focus.k].name,n.focus.left,n.focus.total,Math.ceil(n.focus.left)+'s left'):'<div class="card sub" style="margin-bottom:8px">No active focus. One at a time.</div>';
  h+=n.focuses.map((fc,k)=>{const done=n.fdone.has(k),av=focusAvail(n,k);
   return`<div class="card" style="margin-bottom:8px;opacity:${done||av?1:.45}"><div class="row r"><span><span class="sub">Stage ${k+1}</span> <b>${fc.name}</b></span>${done?'<span class="sub">Completed</span>':av?`<button class="${n.focus||n.gold<(fc.cost||0)?'dis':''}" onclick="startFocusUI(${k})">Start · ${fc.cost||0}g · ${fc.time||30}s</button>`:'<span class="sub">Locked</span>'}</div><div class="sub">${fc.desc||''}</div></div>`}).join('')}
 $('tech').innerHTML=h}
$('rt').oninput=e=>$('rv').textContent=e.target.value+'%';
/* ---- INPUT ---- */
let drag=null;
cv.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,px,py,m:0}};
addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>4)drag.m=1;if(drag.m){px=drag.px+dx;py=drag.py+dy}});
addEventListener('mouseup',e=>{if(drag&&!drag.m&&e.target===cv)clickMap(e);drag=null});
addEventListener('keydown',e=>{if(e.key==='Escape'){bmode=null;cv.style.cursor='default';$('bld').classList.add('hide');$('tech').classList.add('hide')}});
cv.addEventListener('wheel',e=>{e.preventDefault();const nz=Math.max(.2,Math.min(40,z*Math.exp(-e.deltaY*.0015)));px=e.clientX-(e.clientX-px)*nz/z;py=e.clientY-(e.clientY-py)*nz/z;z=nz},{passive:false});
function clickMap(e){
 const x=Math.floor((e.clientX-px)/z),y=Math.floor((e.clientY-py)/z);
 if(x<0||y<0||x>=W||y>=H||!(phase==='spawn'||phase==='play'||phase==='over'))return;
 const i=y*W+x;
 if(phase==='spawn'){
  if(!land[i]||owner[i]||!freeSpot(x,y,12))return msg('Choose free land away from other nations',false);
  spawn(player,x,y,9);phase='play';cv.style.cursor='default';$('bar').classList.remove('hide');hud();msg('Click territory to inspect it. Attack or expand with the troop slider.',false);return}
 if(bmode){if(!land[i])return;const r=build(player,bmode,i);if(r===true){msg(BT[bmode].n+' built',false);bmode=null;cv.style.cursor='default';hud()}else msg(r,false);return}
 if(land[i])showInfo(i);else{sel=null;$('info').classList.add('hide')}}
/* ---- RENDER ---- */
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const FONT='Bahnschrift, Arial';
function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
 if(!off)return;
 if(dirty){octx.putImageData(imgData,0,0);dirty=false}
 ctx.setTransform(z,0,0,z,px,py);ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0);
 ctx.setTransform(1,0,0,1,0,0);ctx.textAlign='center';ctx.textBaseline='middle';
 /* nation names + flags (square corners, shadow only) */
 for(const n of nations){if(!n||!n.alive||n.tiles<200)continue;
  const fs=Math.min(26,Math.sqrt(n.tiles)*z*.28);if(fs<8)continue;
  const X=n.sx/n.tiles*z+px,Y=n.sy/n.tiles*z+py;
  ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=4;ctx.font=`${fs}px ${FONT}`;ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(n.short,X,Y);
  const fw=fs*2,fh=fs*1.3,fy=Y+fs*.75;ctx.shadowBlur=8;
  if(n.fi.complete&&n.fi.naturalWidth)ctx.drawImage(n.fi,X-fw/2,fy,fw,fh);else{ctx.fillStyle=n.hex;ctx.fillRect(X-fw/2,fy,fw,fh)}}
 ctx.shadowBlur=0;
 /* buildings */
 for(const b of blds){const X=(b.x+.5)*z+px,Y=(b.y+.5)*z+py;if(X<-20||Y<-20||X>cv.width+20||Y>cv.height+20)continue;
  const r=Math.max(7,Math.min(16,z*4));
  ctx.fillStyle='rgba(0,0,0,.85)';ctx.beginPath();ctx.arc(X,Y,r+2,0,7);ctx.fill();
  ctx.fillStyle=nations[b.o].hex;ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fill();
  const im=BI[b.t];if(im.complete&&im.naturalWidth)ctx.drawImage(im,X-r*.7,Y-r*.7,r*1.4,r*1.4);else{ctx.fillStyle='#fff';ctx.font=`bold ${r}px ${FONT}`;ctx.fillText(BT[b.t].n[0],X,Y)}}
 /* ships */
 const tf=Math.min(1,acc/100);
 for(const s of ships){
  const p=posAt(s,Math.min(s.len,s.pos+s.v*tf)),X=p.x*z+px,Y=p.y*z+py,r=Math.max(5,z*1.6);
  ctx.save();ctx.translate(X,Y);ctx.rotate(p.a);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(r*1.7,0);ctx.lineTo(-r,-r);ctx.lineTo(-r*.5,0);ctx.lineTo(-r,r);ctx.fill();
  ctx.fillStyle=nations[s.o].hex;ctx.beginPath();ctx.moveTo(r*1.2,0);ctx.lineTo(-r*.6,-r*.6);ctx.lineTo(-r*.3,0);ctx.lineTo(-r*.6,r*.6);ctx.fill();ctx.restore();
  ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.font=`bold 11px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(Math.round(s.troops),X,Y-r-8);ctx.shadowBlur=0}
 /* invasion labels: tweened, rotated toward movement, sized by troops */
 ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=5;
 for(const a of attacks){
  a.dx+=(a.cx-a.dx)*.06;a.dy+=(a.cy-a.dy)*.06;
  a.vx+=((a.cx-a.c2x)-a.vx)*.03;a.vy+=((a.cy-a.c2y)-a.vy)*.03;
  let t=Math.atan2(a.vy,a.vx);if(t>Math.PI/2||t<-Math.PI/2)t=wrap(t+Math.PI);
  a.ang+=wrap(t-a.ang)*.06;
  const X=a.dx*z+px,Y=a.dy*z+py;if(X<-80||Y<-80||X>cv.width+80||Y>cv.height+80)continue;
  const fs=(9+3.2*Math.log2(1+a.troops/40))*Math.min(1.6,Math.max(.8,Math.sqrt(z)));
  ctx.save();ctx.translate(X,Y);ctx.rotate(a.ang);ctx.font=`bold ${fs}px ${FONT}`;ctx.fillStyle='#fff';ctx.fillText(Math.round(a.troops),0,0);ctx.restore()}
 ctx.shadowBlur=0}
function loop(t){
 const dt=t-(loop.l||t);loop.l=t;now=t;
 if(phase==='play'){acc=Math.min(acc+dt*speed,600);while(acc>=100){acc-=100;tick()}}
 fade();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
/* ---- MENU ---- */
$('flags').innerHTML=FC.map(c=>`<div class="fp" data-u="${flagUrl(c)}" style="background-image:url(${flagUrl(c)})"></div>`).join('');
$('flags').firstChild.classList.add('sel');
$('flags').onclick=e=>{const t=e.target.closest('.fp');if(!t)return;pflag=t.dataset.u;for(const k of $('flags').children)k.classList.toggle('sel',k===t);snd('click')};
$('mapsel').innerHTML=Object.keys(MAPS).map(k=>`<option value="${k}">${MAPS[k].label}</option>`).join('');
function fillPl(){$('plsel').innerHTML=MAPS[$('mapsel').value].nations.map((p,k)=>`<option value="${k}">${p.name||p.short}</option>`).join('')}
$('mapsel').onchange=fillPl;fillPl();
$('mode').onchange=()=>{const p=$('mode').value==='pre';$('randopts').style.display=p?'none':'';$('preopts').style.display=p?'':'none'};
$('go').onclick=startGame;phase='menu';
</script></body></html>
